global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "fastapi-api"
    static_configs:
      - targets: ["api:8000"]

  - job_name: "sqs-worker"
    static_configs:
      - targets: ["worker:8001"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]